<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your MedFamily account">
  <title>Login - MedFamily</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo">
          <i class="bi bi-heart-pulse-fill me-2"></i>MedFamily
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to manage your medications</p>
      </div>

      <!-- Error Alert (hidden by default) -->
      <div id="errorAlert" class="alert alert-danger d-none" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span id="errorMessage"></span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
          <div class="invalid-feedback">
            Please enter a valid email address.
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="position-relative">
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
            <button
              type="button"
              class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-muted"
              id="togglePassword"
              style="text-decoration: none; z-index: 10;"
            >
              <i class="bi bi-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
          <div class="invalid-feedback">
            Please enter your password.
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">
              Remember me
            </label>
          </div>
          <a href="#" class="text-primary" style="font-size: 0.9375rem;">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 btn-lg" id="loginButton">
          <i class="bi bi-box-arrow-in-right me-2"></i>Log In
        </button>
      </form>

      <!-- Footer -->
      <div class="auth-footer">
        <p>
          Don't have an account?
          <a href="/pages/register.html" class="text-primary fw-semibold">Sign up here</a>
        </p>
        <p class="mt-2">
          <a href="/" class="text-muted">
            <i class="bi bi-arrow-left me-1"></i>Back to home
          </a>
        </p>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Shared App JS -->
  <script src="/js/app.js"></script>

  <!-- Login Page JS -->
  <script src="/js/login.js"></script>
</body>
</html>
