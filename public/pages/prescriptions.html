<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My Prescriptions - MedFamily">
  <title>Prescriptions - MedFamily</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="/pages/dashboard.html">
        <i class="bi bi-heart-pulse-fill text-primary me-2"></i>
        <span class="fw-bold">MedFamily</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="d-flex align-items-center ms-auto gap-3">
        <div class="nav-item dropdown">
          <a class="nav-link position-relative" href="#" id="notificationDropdown" role="button" data-bs-toggle="dropdown">
            <i class="bi bi-bell fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notificationBadge" style="display: none;">0</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="notificationDropdown" style="min-width: 300px; max-height: 400px; overflow-y: auto;">
            <li class="dropdown-header d-flex justify-content-between align-items-center">
              <span>Notifications</span>
              <button class="btn btn-sm btn-link text-primary p-0" id="markAllReadBtn" style="font-size: 0.875rem;">Mark all read</button>
            </li>
            <li><hr class="dropdown-divider"></li>
            <div id="notificationList">
              <li class="dropdown-item text-muted text-center py-3">No notifications</li>
            </div>
          </ul>
        </div>
        <div class="nav-item dropdown me-3">
          <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-1"></i>
            <span id="userName">User</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="/pages/dashboard.html"><i class="bi bi-house-door me-2"></i>Dashboard</a></li>
            <li><a class="dropdown-item" href="/pages/prescriptions.html"><i class="bi bi-capsule me-2"></i>Prescriptions</a></li>
            <li><a class="dropdown-item" href="/pages/allergies.html"><i class="bi bi-exclamation-triangle me-2"></i>Allergies</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse" id="sidebarMenu">
        <div class="position-sticky pt-3">
          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link" href="/pages/dashboard.html">
                <i class="bi bi-house-door me-2"></i>
                Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/pages/prescriptions.html">
                <i class="bi bi-capsule me-2"></i>
                Prescriptions
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/pages/allergies.html">
                <i class="bi bi-exclamation-triangle me-2"></i>
                Allergies
              </a>
            </li>
          </ul>

          <!-- Family Invite Code -->
          <div class="mt-auto pt-4 px-3 border-top">
            <h6 class="text-muted mb-2">
              <i class="bi bi-people me-1"></i>
              Family Code
            </h6>
            <div class="input-group input-group-sm mb-2">
              <input type="text" class="form-control" id="familyCodeDisplay" readonly>
              <button class="btn btn-outline-primary" id="copyFamilyCodeBtn" title="Copy code">
                <i class="bi bi-clipboard"></i>
              </button>
            </div>
            <small class="text-muted">Share with caregivers</small>
          </div>
        </div>
      </nav>

      <!-- Main Content -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
          <h1 class="h2">My Prescriptions</h1>
          <div class="btn-toolbar mb-2 mb-md-0">
            <div class="btn-group me-2">
              <button type="button" class="btn btn-sm btn-outline-secondary" id="filterAll">All</button>
              <button type="button" class="btn btn-sm btn-outline-secondary active" id="filterActive">Active</button>
            </div>
            <button type="button" class="btn btn-sm btn-primary me-2" data-bs-toggle="modal" data-bs-target="#addPrescriptionModal">
              <i class="bi bi-plus-lg me-1"></i>
              Add Medication
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="refreshPageBtn">
              <i class="bi bi-arrow-clockwise me-1"></i>
              Refresh
            </button>
          </div>
        </div>

        <!-- Prescriptions List -->
        <div id="prescriptionsContainer">
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Loading prescriptions...</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Medication Modal -->
  <div class="modal fade" id="addPrescriptionModal" tabindex="-1" aria-labelledby="addPrescriptionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addPrescriptionModalLabel">
            <i class="bi bi-capsule me-2"></i>Add Daily Medication
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Safety warnings shown here if any -->
          <div id="safetyWarnings" class="alert alert-warning d-none">
            <strong><i class="bi bi-exclamation-triangle me-1"></i>Safety Warning</strong>
            <div id="warningsList" class="mt-2"></div>
            <div class="mt-2">
              <input type="checkbox" id="overrideWarnings" class="form-check-input me-1">
              <label for="overrideWarnings" class="form-check-label">I understand the risks and want to proceed anyway</label>
            </div>
          </div>

          <form id="addPrescriptionForm">
            <div class="mb-3">
              <label class="form-label">Medication <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="medSearch" placeholder="Search by name..." autocomplete="off">
              <div id="medSearchResults" class="list-group mt-1" style="max-height:200px;overflow-y:auto;"></div>
              <input type="hidden" id="selectedMedId">
              <div id="selectedMedDisplay" class="mt-1 text-success fw-semibold"></div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Dosage <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="dosage" placeholder="e.g. 500mg">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Frequency <span class="text-danger">*</span></label>
                <select class="form-select" id="frequency">
                  <option value="once_daily">Once daily</option>
                  <option value="twice_daily">Twice daily</option>
                  <option value="three_times_daily">Three times daily</option>
                  <option value="four_times_daily">Four times daily</option>
                  <option value="as_needed">As needed</option>
                </select>
              </div>
            </div>
            <div class="mb-3" id="scheduleTimesContainer"></div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Start Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="startDate">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Duration (days)</label>
                <input type="number" class="form-control" id="durationDays" placeholder="Leave blank = ongoing" min="1">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Prescribed By</label>
                <input type="text" class="form-control" id="prescribedBy" placeholder="Doctor name or Self">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Instructions</label>
              <input type="text" class="form-control" id="instructions" placeholder="e.g. Take with food">
            </div>
            <div class="mb-3">
              <label class="form-label">Notes</label>
              <textarea class="form-control" id="prescriptionNotes" rows="2" placeholder="Any additional notes..."></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="submitPrescriptionBtn">
            <span id="submitBtnText">Add Medication</span>
            <span id="submitBtnSpinner" class="spinner-border spinner-border-sm ms-1 d-none" role="status"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Shared App JS -->
  <script src="/js/app.js"></script>

  <!-- Prescriptions JS -->
  <script src="/js/prescriptions.js"></script>
</body>
</html>
